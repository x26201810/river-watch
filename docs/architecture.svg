<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker>
    <style>
      .box{fill:#f4f7fb;stroke:#3a5a80;stroke-width:1.5;rx:8}
      .key{fill:#fff4e5;stroke:#b26a00;stroke-width:1.5}
      .src{fill:#eef7ee;stroke:#3c7a3c;stroke-width:1.5}
      .t{font-weight:bold;font-size:14px}
      .s{fill:#444;font-size:12px}
      line,path.l{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="20" y="28" class="t" font-size="17">River Watch: who asks, what it reads, where the key lives</text>

  <!-- people -->
  <rect class="box" x="20" y="60" width="200" height="74" rx="8"/>
  <text x="36" y="84" class="t">Duty Officer / Area Manager</text>
  <text x="36" y="104" class="s">opens the link at ~15:30,</text>
  <text x="36" y="120" class="s">decides by 16:00, records reason</text>

  <!-- page -->
  <rect class="box" x="300" y="50" width="330" height="190" rx="8"/>
  <text x="316" y="74" class="t">River Watch page (GitHub Pages, public)</text>
  <text x="316" y="96" class="s">Runs in the browser. Plain JavaScript does all the</text>
  <text x="316" y="112" class="s">numbers: forecast peak, P95/P99 test, warning bump,</text>
  <text x="316" y="128" class="s">barrier sets, crew allocation (Flood Plan rules 2-7).</text>
  <text x="316" y="150" class="s">Stored file: history_summary.json (one row per town,</text>
  <text x="316" y="166" class="s">P95/P99 from 2016-2025, built once by a script).</text>
  <text x="316" y="188" class="s">Shows every number with its source and time.</text>
  <text x="316" y="204" class="s">No API key anywhere in the page or the repo.</text>

  <!-- sheet -->
  <rect class="src" x="700" y="50" width="260" height="70" rx="8"/>
  <text x="716" y="74" class="t">Team Google Sheet</text>
  <text x="716" y="94" class="s">Towns tab: kit, staff, notes, overrides</text>
  <text x="716" y="110" class="s">read via the Apps Script on every load</text>

  <!-- sources -->
  <rect class="src" x="700" y="140" width="260" height="70" rx="8"/>
  <text x="716" y="164" class="t">Open-Meteo Flood API (GloFAS v4)</text>
  <text x="716" y="184" class="s">daily river discharge, today + 2 days,</text>
  <text x="716" y="200" class="s">8 fixed grid cells (one per town)</text>

  <rect class="src" x="700" y="230" width="260" height="70" rx="8"/>
  <text x="716" y="254" class="t">Met Éireann warnings</text>
  <text x="716" y="274" class="s">warning_IRELAND.json, regions = FIPS</text>
  <text x="716" y="290" class="s">county codes (EI04 Cork ...)</text>

  <rect class="src" x="700" y="320" width="260" height="70" rx="8"/>
  <text x="716" y="344" class="t">OPW hydro-data (offline check)</text>
  <text x="716" y="364" class="s">measured gauge flow, used once to</text>
  <text x="716" y="380" class="s">prove each cell is on the right river</text>

  <!-- worker -->
  <rect class="key" x="300" y="300" width="330" height="110" rx="8"/>
  <text x="316" y="324" class="t">Google Apps Script web app (the only server)</text>
  <text x="316" y="346" class="s">Standalone script; key in Script Properties.</text>
  <text x="316" y="362" class="s">Reads the private Sheet + ECB euro rate, fixes</text>
  <text x="316" y="378" class="s">model and max_tokens, throttles per minute, sends</text>
  <text x="316" y="394" class="s">only the computed facts table + question.</text>

  <!-- brain -->
  <rect class="box" x="300" y="460" width="330" height="80" rx="8"/>
  <text x="316" y="484" class="t">Claude Haiku 5.5 (Anthropic API)</text>
  <text x="316" y="504" class="s">Explains the computed advice in plain English and</text>
  <text x="316" y="520" class="s">answers questions. Spend limit $5 (~€4.56)/month.</text>

  <!-- arrows -->
  <line x1="220" y1="97" x2="298" y2="120"/>
  <path class="l" d="M700 100 C660 120 660 330 632 340"/>
  <line x1="700" y1="175" x2="632" y2="160"/>
  <line x1="700" y1="265" x2="632" y2="215"/>
  <path class="l" d="M700 355 C660 355 660 260 632 240" stroke-dasharray="5 4"/>
  <line x1="465" y1="240" x2="465" y2="298"/>
  <line x1="465" y1="410" x2="465" y2="458"/>
  <text x="474" y="276" class="s">question + facts</text>
  <text x="474" y="440" class="s">key added here only</text>
  <text x="640" y="320" class="s" font-style="italic">dashed = used once</text>
</svg>
